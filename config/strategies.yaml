strategies:
  # ── 右侧趋势策略：顺势、控损、耐心 ──────────────────────────────────────
  # 入场：EMA金叉 + MACD>0 + 量价齐升（右侧确认）
  # 减仓：0轴上方出现死叉（先锁利润）
  # 清仓：均线拐头向下 / MACD转负死叉
  # 止损：固定10%，仓位20%（铁律）
  - name: eth_rightside_swap
    class: RightSideStrategy
    enabled: true
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      timeframe: "1H"
      ema_fast: 9
      ema_slow: 21
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      atr_period: 14
      vol_period: 20
      sl_pct: 0.10              # 止损10%（铁律）
      reduce_ratio: 0.5         # 减仓比例50%
      vol_threshold: 1.5        # 量价确认：成交量 >= 均量 × 1.5
      position_size_pct: 0.2    # 2成仓位（铁律）
      leverage: 3
      td_mode: cross
      cooldown_candles: 2

  - name: btc_rightside_swap
    class: RightSideStrategy
    enabled: false
    inst_type: SWAP
    symbol: BTC-USDT-SWAP
    config:
      timeframe: "1H"
      ema_fast: 9
      ema_slow: 21
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      atr_period: 14
      vol_period: 20
      sl_pct: 0.10
      reduce_ratio: 0.5
      vol_threshold: 1.5
      position_size_pct: 0.2
      leverage: 3
      td_mode: cross
      cooldown_candles: 2

  - name: eth_rightside_spot
    class: RightSideStrategy
    enabled: false
    inst_type: SPOT
    symbol: ETH-USDT
    config:
      timeframe: "1H"
      ema_fast: 9
      ema_slow: 21
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      atr_period: 14
      vol_period: 20
      sl_pct: 0.10
      reduce_ratio: 0.5
      vol_threshold: 1.5
      position_size_pct: 0.2
      cooldown_candles: 2

  # ── 多时框趋势策略：4H 定方向 + 1H 做决策 + 15M 找买卖点 ─────────────
  - name: eth_mtf_swap
    class: MtfTrendStrategy
    enabled: false
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      # 4H：宏观趋势
      h4_timeframe: "4H"
      h4_ema_fast: 20
      h4_ema_slow: 50
      h4_vol_period: 20
      # 1H：中期偏向
      h1_timeframe: "1H"
      h1_ema_fast: 9
      h1_ema_slow: 21
      h1_macd_fast: 12
      h1_macd_slow: 26
      h1_macd_signal: 9
      h1_vol_period: 20
      # 15M：精确入场（执行时框）
      timeframe: "15m"
      m15_ema_fast: 9
      m15_ema_slow: 21
      m15_vol_period: 20
      # 公共参数
      atr_period: 14
      atr_sl_multiplier: 2.5
      vol_threshold: 1.5          # 入场要求成交量 >= 均量 x 1.2
      position_size_pct: 0.1
      leverage: 5
      td_mode: cross
      cooldown_candles: 3

  - name: btc_mtf_swap
    class: MtfTrendStrategy
    enabled: false
    inst_type: SWAP
    symbol: BTC-USDT-SWAP
    config:
      h4_timeframe: "4H"
      h4_ema_fast: 20
      h4_ema_slow: 50
      h4_vol_period: 20
      h1_timeframe: "1H"
      h1_ema_fast: 9
      h1_ema_slow: 21
      h1_macd_fast: 12
      h1_macd_slow: 26
      h1_macd_signal: 9
      h1_vol_period: 20
      timeframe: "15m"
      m15_ema_fast: 9
      m15_ema_slow: 21
      m15_vol_period: 20
      atr_period: 14
      atr_sl_multiplier: 2.5
      vol_threshold: 1.2
      position_size_pct: 0.1
      leverage: 3
      td_mode: cross
      cooldown_candles: 2

  # ── 现货趋势策略 ──────────────────────────────────────────────────────
  - name: btc_trend_spot
    class: TrendStrategy
    enabled: false
    inst_type: SPOT
    symbol: BTC-USDT
    config:
      timeframe: "5m"
      ema_fast: 9
      ema_slow: 21
      macd_fast: 5         # 缩短适配5分钟线，响应更快
      macd_slow: 13
      macd_signal: 3
      atr_period: 14
      atr_sl_multiplier: 2.0
      position_size_pct: 0.1
      require_spread_expand: true  # 要求交叉时EMA间距正在扩大
      cooldown_candles: 3          # 开/平仓后等 3 根K线（15分钟）

  # ── 合约趋势策略 ──────────────────────────────────────────────────────
  - name: eth_trend_swap
    class: TrendStrategy
    enabled: false
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      timeframe: "15m"
      ema_fast: 9
      ema_slow: 21
      macd_fast: 5
      macd_slow: 13
      macd_signal: 3
      atr_period: 14
      atr_sl_multiplier: 2.5
      leverage: 10
      td_mode: cross
      position_size_pct: 0.2
      require_spread_expand: true
      cooldown_candles: 3

  # ── BB+RSI 均值回归（振荡行情）────────────────────────────────────────
  - name: btc_bbrsi_spot
    class: BbRsiStrategy
    enabled: false
    inst_type: SPOT
    symbol: BTC-USDT
    config:
      timeframe: "15m"
      bb_period: 20
      bb_std: 2.0
      rsi_period: 14
      rsi_oversold: 30
      rsi_overbought: 70
      atr_period: 14
      atr_sl_multiplier: 1.5
      position_size_pct: 0.1
      cooldown_candles: 3

  - name: eth_bbrsi_swap
    class: BbRsiStrategy
    enabled: false
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      timeframe: "15m"
      bb_period: 20
      bb_std: 2.0
      rsi_period: 14
      rsi_oversold: 30
      rsi_overbought: 70
      atr_period: 14
      atr_sl_multiplier: 1.5
      leverage: 5
      td_mode: cross
      position_size_pct: 0.15
      cooldown_candles: 3

  # ── Donchian 通道突破（大趋势）────────────────────────────────────────
  - name: btc_donchian_swap
    class: DonchianStrategy
    enabled: false
    inst_type: SWAP
    symbol: BTC-USDT-SWAP
    config:
      timeframe: "1H"
      entry_period: 20       # 突破20周期新高/新低入场
      exit_period: 10        # 跌破10周期低点/高点出场
      atr_period: 14
      atr_sl_multiplier: 2.0
      leverage: 5
      td_mode: cross
      position_size_pct: 0.15
      cooldown_candles: 2

  - name: eth_donchian_swap
    class: DonchianStrategy
    enabled: false
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      timeframe: "1H"
      entry_period: 20
      exit_period: 10
      atr_period: 14
      atr_sl_multiplier: 2.0
      leverage: 5
      td_mode: cross
      position_size_pct: 0.15
      cooldown_candles: 2

  # ── 网格策略（振荡区间）───────────────────────────────────────────────
  - name: btc_grid_spot
    class: GridStrategy
    enabled: false
    inst_type: SPOT
    symbol: BTC-USDT
    config:
      timeframe: "5m"
      grid_lower: 70000      # 网格下轨（需根据行情手动设定）
      grid_upper: 90000      # 网格上轨
      n_grids: 10            # 格数
      grid_dual: false       # 现货单向做多
      position_size_pct: 0.3 # 总仓位，每格 = 0.3/10 = 3%

  - name: eth_grid_swap
    class: GridStrategy
    enabled: false
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      timeframe: "5m"
      grid_lower: 1600
      grid_upper: 2400
      n_grids: 10
      grid_dual: true        # 合约双向网格
      leverage: 3
      td_mode: cross
      position_size_pct: 0.3

  # ── VWAP 偏离回归（日内）─────────────────────────────────────────────
  - name: btc_vwap_swap
    class: VwapStrategy
    enabled: false
    inst_type: SWAP
    symbol: BTC-USDT-SWAP
    config:
      timeframe: "5m"
      vwap_std_mult: 1.5     # 入场阈值：VWAP ± 1.5σ
      rsi_period: 14
      rsi_oversold: 35
      rsi_overbought: 65
      atr_period: 14
      atr_sl_multiplier: 1.5
      leverage: 5
      td_mode: cross
      position_size_pct: 0.1
      cooldown_candles: 3

  - name: eth_vwap_swap
    class: VwapStrategy
    enabled: false
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      timeframe: "5m"
      vwap_std_mult: 1.5
      rsi_period: 14
      rsi_oversold: 35
      rsi_overbought: 65
      atr_period: 14
      atr_sl_multiplier: 1.5
      leverage: 5
      td_mode: cross
      position_size_pct: 0.1
      cooldown_candles: 3

  # ── 金字塔加仓：上升趋势回调分批建仓（先定风险、再反推仓位）────────────
  # 入场：4H 均线向上 + 价格回调至第一道斐波那契支撑
  # 加仓：触及下一道支撑 且 距上次成交 >= 1.2×ATR，档位越深投入越大
  # 出场：跌破失效价（结构止损）/ 满档滞留超时 / 阶梯止盈（递减目标，分批减仓）
  # 仓位：由「加满档打到止损时恰好亏掉 risk_pct」反解，最坏情况开仓前已知
  #
  # ⚠️ 仍是马丁格尔型：胜率高、左尾厚。默认关闭，启用前请读 README 的
  #    「PyramidStrategy 优缺点分析」并跑一段含单边下跌的回测。
  - name: btc_pyramid_swap
    class: PyramidStrategy
    enabled: false
    inst_type: SWAP
    symbol: BTC-USDT-SWAP
    config:
      timeframe: "15m"          # 主时框：止损/止盈/加仓触发检查
      higher_timeframe: "4H"    # 高时框：趋势方向、支撑位、ATR
      max_steps: 6
      pyramid_ratio: 1.3
      risk_pct: 0.02            # 单轮最大可接受亏损 = 权益的 2%
      max_leverage: 5           # 反推出的满档名义杠杆上限，超过则放弃该轮
      stop_atr_mult: 1.5        # 失效价 = 最低支撑 − 1.5×ATR
      tp_schedule: [0.050, 0.038, 0.030, 0.025, 0.020, 0.015]   # 递减
      partial_tp: true          # 止盈先平最深一档，逐步降暴露
      max_hold_bars: 200        # 满档滞留上限（15m × 200 ≈ 2 天）
      trend_filter: true
      ema_fast: 21
      ema_slow: 55
      first_entry_at_support: true
      atr_period: 14
      atr_multiplier: 1.2
      fib_lookback: 100
      td_mode: cross

  - name: eth_pyramid_swap
    class: PyramidStrategy
    enabled: false
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      timeframe: "15m"
      higher_timeframe: "4H"
      max_steps: 6
      pyramid_ratio: 1.3
      risk_pct: 0.02
      max_leverage: 5
      # ETH 波动大于 BTC，止损缓冲放宽一档，避免在正常波动里被扫出去
      stop_atr_mult: 2.0
      tp_schedule: [0.060, 0.045, 0.035, 0.028, 0.022, 0.018]
      partial_tp: true
      max_hold_bars: 200
      trend_filter: true
      ema_fast: 21
      ema_slow: 55
      first_entry_at_support: true
      atr_period: 14
      atr_multiplier: 1.2
      fib_lookback: 100
      td_mode: cross
