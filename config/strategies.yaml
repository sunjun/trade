# 通用配置项（任意策略可用）：
#   on_existing_position  启动时交易所已有该品种持仓怎么办
#     adopt （默认）接管进策略状态机，由策略的出场逻辑管理
#     ignore        不接管，策略以空仓启动（手动开的仓位、人工自己管）
#     abort         拒绝启动该策略，交由人工处理
#   td_mode               保证金模式，必须与交易所上已有持仓一致，否则平不掉
#   equity_pct            本策略可动用账户权益的比例，默认 1.0（独占整个账户）
#   max_equity            本策略可动用的绝对上限（USDT），默认不限
#     两者同时给时取更紧的那个。所有策略共用一个 Portfolio，权益是整个账户的，
#     不分配的话同时启用 N 个策略每个都按全额算仓位，实际风险叠加成 N 倍。
#     RISK__MAX_POSITION_PCT 那道名义闸门也按分配后的额度算，不是按账户全额。

strategies:
  # ── 右侧趋势策略：顺势、控损、耐心 ──────────────────────────────────────
  # 入场：EMA金叉 + MACD>0 + 量价齐升（右侧确认）
  # 减仓：0轴上方出现死叉（先锁利润）
  # 清仓：均线拐头向下 / MACD转负死叉
  # 止损：固定10%，仓位20%（铁律）
  - name: eth_rightside_swap
    class: RightSideStrategy
    enabled: false
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      timeframe: "1H"
      ema_fast: 9
      ema_slow: 21
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      atr_period: 14
      vol_period: 20
      sl_pct: 0.10              # 止损10%（铁律）
      reduce_ratio: 0.5         # 减仓比例50%
      vol_threshold: 1.5        # 量价确认：成交量 >= 均量 × 1.5
      position_size_pct: 0.2    # 2成仓位（铁律）
      leverage: 3
      td_mode: cross
      cooldown_candles: 2

  - name: btc_rightside_swap
    class: RightSideStrategy
    enabled: false
    inst_type: SWAP
    symbol: BTC-USDT-SWAP
    config:
      timeframe: "1H"
      ema_fast: 9
      ema_slow: 21
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      atr_period: 14
      vol_period: 20
      sl_pct: 0.10
      reduce_ratio: 0.5
      vol_threshold: 1.5
      position_size_pct: 0.2
      leverage: 3
      td_mode: cross
      cooldown_candles: 2

  - name: eth_rightside_spot
    class: RightSideStrategy
    enabled: false
    inst_type: SPOT
    symbol: ETH-USDT
    config:
      timeframe: "1H"
      ema_fast: 9
      ema_slow: 21
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      atr_period: 14
      vol_period: 20
      sl_pct: 0.10
      reduce_ratio: 0.5
      vol_threshold: 1.5
      position_size_pct: 0.2
      cooldown_candles: 2

  # ── 多时框趋势策略：4H 定方向 + 1H 做决策 + 15M 找买卖点 ─────────────
  - name: eth_mtf_swap
    class: MtfTrendStrategy
    enabled: false
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      # 4H：宏观趋势
      h4_timeframe: "4H"
      h4_ema_fast: 20
      h4_ema_slow: 50
      h4_vol_period: 20
      # 1H：中期偏向
      h1_timeframe: "1H"
      h1_ema_fast: 9
      h1_ema_slow: 21
      h1_macd_fast: 12
      h1_macd_slow: 26
      h1_macd_signal: 9
      h1_vol_period: 20
      # 15M：精确入场（执行时框）
      timeframe: "15m"
      m15_ema_fast: 9
      m15_ema_slow: 21
      m15_vol_period: 20
      # 公共参数
      atr_period: 14
      atr_sl_multiplier: 2.5
      vol_threshold: 1.5          # 入场要求成交量 >= 均量 x 1.2
      position_size_pct: 0.1
      leverage: 5
      td_mode: cross
      cooldown_candles: 3

  - name: btc_mtf_swap
    class: MtfTrendStrategy
    enabled: false
    inst_type: SWAP
    symbol: BTC-USDT-SWAP
    config:
      h4_timeframe: "4H"
      h4_ema_fast: 20
      h4_ema_slow: 50
      h4_vol_period: 20
      h1_timeframe: "1H"
      h1_ema_fast: 9
      h1_ema_slow: 21
      h1_macd_fast: 12
      h1_macd_slow: 26
      h1_macd_signal: 9
      h1_vol_period: 20
      timeframe: "15m"
      m15_ema_fast: 9
      m15_ema_slow: 21
      m15_vol_period: 20
      atr_period: 14
      atr_sl_multiplier: 2.5
      vol_threshold: 1.2
      position_size_pct: 0.1
      leverage: 3
      td_mode: cross
      cooldown_candles: 2

  # ── 现货趋势策略 ──────────────────────────────────────────────────────
  - name: btc_trend_spot
    class: TrendStrategy
    enabled: false
    inst_type: SPOT
    symbol: BTC-USDT
    config:
      timeframe: "5m"
      ema_fast: 9
      ema_slow: 21
      macd_fast: 5         # 缩短适配5分钟线，响应更快
      macd_slow: 13
      macd_signal: 3
      atr_period: 14
      atr_sl_multiplier: 2.0
      position_size_pct: 0.1
      require_spread_expand: true  # 要求交叉时EMA间距正在扩大
      cooldown_candles: 3          # 开/平仓后等 3 根K线（15分钟）

  # ── 合约趋势策略 ──────────────────────────────────────────────────────
  - name: eth_trend_swap
    class: TrendStrategy
    enabled: false
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      timeframe: "15m"
      ema_fast: 9
      ema_slow: 21
      macd_fast: 5
      macd_slow: 13
      macd_signal: 3
      atr_period: 14
      atr_sl_multiplier: 2.5
      leverage: 10
      td_mode: cross
      position_size_pct: 0.2
      require_spread_expand: true
      cooldown_candles: 3

  # ── BB+RSI 均值回归（振荡行情）────────────────────────────────────────
  - name: btc_bbrsi_spot
    class: BbRsiStrategy
    enabled: false
    inst_type: SPOT
    symbol: BTC-USDT
    config:
      timeframe: "15m"
      bb_period: 20
      bb_std: 2.0
      rsi_period: 14
      rsi_oversold: 30
      rsi_overbought: 70
      atr_period: 14
      atr_sl_multiplier: 1.5
      position_size_pct: 0.1
      cooldown_candles: 3

  - name: eth_bbrsi_swap
    class: BbRsiStrategy
    enabled: false
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      timeframe: "15m"
      bb_period: 20
      bb_std: 2.0
      rsi_period: 14
      rsi_oversold: 30
      rsi_overbought: 70
      atr_period: 14
      atr_sl_multiplier: 1.5
      leverage: 5
      td_mode: cross
      position_size_pct: 0.15
      cooldown_candles: 3

  # ── Donchian 通道突破（大趋势）────────────────────────────────────────
  - name: btc_donchian_swap
    class: DonchianStrategy
    enabled: false
    inst_type: SWAP
    symbol: BTC-USDT-SWAP
    config:
      timeframe: "1H"
      entry_period: 20       # 突破20周期新高/新低入场
      exit_period: 10        # 跌破10周期低点/高点出场
      atr_period: 14
      atr_sl_multiplier: 2.0
      leverage: 5
      td_mode: cross
      position_size_pct: 0.15
      cooldown_candles: 2

  - name: eth_donchian_swap
    class: DonchianStrategy
    enabled: false
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      timeframe: "1H"
      entry_period: 20
      exit_period: 10
      atr_period: 14
      atr_sl_multiplier: 2.0
      leverage: 5
      td_mode: cross
      position_size_pct: 0.15
      cooldown_candles: 2

  # ── 利弗摩尔式突破加码（反马丁格尔）──────────────────────────────────────
  # 与 PyramidStrategy 方向相反：向盈利加码，最大仓位出现在判断已被验证的时刻。
  # 收益分布也相反——胜率低、右尾厚，靠少数几笔大趋势覆盖大量小亏。
  - name: eth_livermore_swap
    class: LivermoreStrategy
    enabled: false
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      # 时框不是随便选的，也不是最优的——是唯一「有效且样本够」的那一档。
      # ETH 5 年仅多、闸门 25%：1H 噪声主导（PF 1.10、回撤 −15%），日线看着最好
      # （+36%、PF 5.41）但只有 29 个回合，其中 71.7% 净利来自单独一笔，去掉它
      # 只剩 +1026 USDT。4H 有 112 个回合，最大一笔占 41.3%，去掉后仍有 +2160。
      # 注意 2H/20 是负的（−0.45%）而两侧都为正，时框方向并不是平滑响应，
      # 换时框必须重测，不能按「时长等价」直接换算周期数。
      timeframe: "4H"
      # 通道周期是一片平台不是一个尖峰：ETH 5 年仅多、闸门 25% 下，
      # 8/10 根直接失效（PF 1.00），15 根转正，20~55 根全部通过前后半样本外
      # 检验（PF 1.37~1.76）。20 落在平台下沿，往里挪一档留安全边际——
      # 取 30 不是因为它跑分最高（那是噪声），是因为它离失效区最远。
      entry_period: 30       # 关键点：突破前 30 根 4H（约 5 天）极值
      exit_period: 15
      atr_period: 20
      unit_risk_pct: 0.005   # 每个单位触及自身初始止损时亏 0.5% 权益
      max_units: 4
      add_atr_step: 1.0      # 每朝有利方向走 1N 加一个单位（0.5N 在所有闸门档位都更差）
      # stop_atr_mult 与账户级 RISK__MAX_POSITION_PCT 强耦合：止损越紧，单位名义
      # 越大、越容易被闸门截断。ETH 5 年、30/15、仅多（年化，已扣 taker 费、
      # 未扣资金费约 1%）：
      #   闸门 0.25 → 2N: +2.81%✗  3N: +5.22%✓  4N: +5.03%✓
      #   闸门 0.75 → 2N: +12.78%✓ 3N: +10.71%✓ 4N: +9.37%✓
      #   （✓ = 前后半样本外皆正）
      # 闸门收紧时紧止损被截断得最狠，放开时反而最优——两条曲线是交叉的，
      # 所以改 RISK__MAX_POSITION_PCT 必须连带重选 stop_atr_mult。
      # 当前 0.25 闸门下 3N/4N 打平（回撤同为 −8.02%），取 4N 因其 PF 略高
      # 且离 2N 那个失效区更远。
      stop_atr_mult: 4.0     # 止损距最新成交价 4N，每次加码后一并上移
      unit_ratio: 1.0        # 1.0=等量（海龟原版）；<1 = 越晚越轻（利弗摩尔原味）
      # 做空逻辑完整可用（下破通道开空、每跌一档加码、止损下移），但不值得开。
      # ETH 5 年、30/15、闸门 25%：仅多 +27.60%/回撤 −8.03%/PF 1.69，
      # 多+空 +27.99%/回撤 −8.50%/PF 1.38 —— 多做一倍的交易换来 +0.39pp 收益，
      # 却把盈亏比压低了。对照条目 eth_livermore_ls_swap 可随时复跑。
      allow_short: false
      cooldown_candles: 1
      leverage: 3
      td_mode: cross
      on_existing_position: ignore
      equity_pct: 1.0        # 本策略可动用账户权益的比例（见文件头）
      # max_equity: 2000     # 可选：绝对上限 USDT。与 equity_pct 同时给时取更紧的那个

  # 同上，但多空都做——仅用于对照回测，不上实盘
  - name: eth_livermore_ls_swap
    class: LivermoreStrategy
    enabled: true
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      timeframe: "4H"
      entry_period: 30       # 与 eth_livermore_swap 保持一致，只差 allow_short
      exit_period: 15
      atr_period: 20
      unit_risk_pct: 0.005
      max_units: 4
      add_atr_step: 1.0
      stop_atr_mult: 4.0
      unit_ratio: 1.0
      allow_short: true
      cooldown_candles: 1
      leverage: 3
      td_mode: cross
      on_existing_position: ignore
      equity_pct: 1.0        # 本策略可动用账户权益的比例（见文件头）
      max_equity: 400     # 可选：绝对上限 USDT。与 equity_pct 同时给时取更紧的那个

  # ── 网格策略（振荡区间）───────────────────────────────────────────────
  - name: btc_grid_spot
    class: GridStrategy
    enabled: false
    inst_type: SPOT
    symbol: BTC-USDT
    config:
      timeframe: "5m"
      grid_lower: 70000      # 网格下轨（需根据行情手动设定）
      grid_upper: 90000      # 网格上轨
      n_grids: 10            # 格数
      grid_dual: false       # 现货单向做多
      position_size_pct: 0.3 # 总仓位，每格 = 0.3/10 = 3%

  - name: eth_grid_swap
    class: GridStrategy
    enabled: false
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      timeframe: "5m"
      grid_lower: 1600
      grid_upper: 2400
      n_grids: 10
      grid_dual: true        # 合约双向网格
      leverage: 3
      td_mode: cross
      position_size_pct: 0.3

  # ── VWAP 偏离回归（日内）─────────────────────────────────────────────
  - name: btc_vwap_swap
    class: VwapStrategy
    enabled: false
    inst_type: SWAP
    symbol: BTC-USDT-SWAP
    config:
      timeframe: "5m"
      vwap_std_mult: 1.5     # 入场阈值：VWAP ± 1.5σ
      rsi_period: 14
      rsi_oversold: 35
      rsi_overbought: 65
      atr_period: 14
      atr_sl_multiplier: 1.5
      leverage: 5
      td_mode: cross
      position_size_pct: 0.1
      cooldown_candles: 3

  - name: eth_vwap_swap
    class: VwapStrategy
    enabled: false
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      timeframe: "5m"
      vwap_std_mult: 1.5
      rsi_period: 14
      rsi_oversold: 35
      rsi_overbought: 65
      atr_period: 14
      atr_sl_multiplier: 1.5
      leverage: 5
      td_mode: cross
      position_size_pct: 0.1
      cooldown_candles: 3

  # ── 金字塔加仓：上升趋势回调分批建仓（先定风险、再反推仓位）────────────
  # 入场：4H 均线向上 + 价格回调至第一道斐波那契支撑
  # 加仓：触及下一道支撑 且 距上次成交 >= 1.2×ATR，档位越深投入越大
  # 出场：跌破失效价（结构止损）/ 满档滞留超时 / 阶梯止盈（递减目标，分批减仓）
  # 仓位：由「加满档打到止损时恰好亏掉 risk_pct」反解，最坏情况开仓前已知
  #
  # ⚠️ 仍是马丁格尔型：胜率高、左尾厚。默认关闭，启用前请读 README 的
  #    「PyramidStrategy 优缺点分析」并跑一段含单边下跌的回测。
  - name: btc_pyramid_swap
    class: PyramidStrategy
    enabled: false
    inst_type: SWAP
    symbol: BTC-USDT-SWAP
    config:
      timeframe: "15m"          # 主时框：止损/止盈/加仓触发检查
      higher_timeframe: "4H"    # 高时框：趋势方向、支撑位、ATR
      max_steps: 6
      pyramid_ratio: 1.3
      risk_pct: 0.02            # 单轮最大可接受亏损 = 权益的 2%
      max_leverage: 5           # 反推出的满档名义杠杆上限，超过则放弃该轮
      stop_atr_mult: 1.5        # 失效价 = 最低支撑 − 1.5×ATR
      tp_schedule: [0.050, 0.038, 0.030, 0.025, 0.020, 0.015]   # 递减
      partial_tp: true          # 止盈先平最深一档，逐步降暴露
      max_hold_bars: 200        # 满档滞留上限（15m × 200 ≈ 2 天）
      trend_filter: true
      ema_fast: 21
      ema_slow: 55
      first_entry_at_support: true
      atr_period: 14
      atr_multiplier: 1.2
      fib_lookback: 100
      td_mode: cross

  - name: eth_pyramid_swap
    class: PyramidStrategy
    enabled: false
    inst_type: SWAP
    symbol: ETH-USDT-SWAP
    config:
      timeframe: "15m"
      higher_timeframe: "4H"
      # 3 档而非 6 档：止损价永远钉在最低支撑下方（与 max_steps 无关），而阶梯
      # 只铺到第 max_steps 道支撑。档数越多，深档越贴近止损、每张亏得越少，同样的
      # 风险预算就买到越多张——弹药大半押在 0.786/前低这些极少成交的位置上，首档
      # 反而小到被 lotSz 取整吃掉。3 档把预算集中在真正会成交的支撑上。
      # 半年回测：年化 3.11% vs 6 档 1.55%，平均亏损 1.24 vs 4.00 USDT。
      max_steps: 3
      pyramid_ratio: 1.3
      # 单轮最坏亏损 1% 权益。不是 2%：max_leverage 0.25 这条闸门本身
      # 就隐含了「实际风险 <= 0.25 × 止损距离%」≈ 1.1%，写 2% 兑现不了，
      # 只会让 _plan_round 每轮都因满档杠杆超限而放弃。
      risk_pct: 0.01
      max_leverage: 0.25   # 满档名义 <= 权益 25%，与 RISK__MAX_POSITION_PCT 对齐
      # ETH 波动大于 BTC，止损缓冲放宽一档，避免在正常波动里被扫出去
      stop_atr_mult: 2.0
      tp_schedule: [0.060, 0.045, 0.035, 0.028, 0.022, 0.018]
      partial_tp: true
      max_hold_bars: 200
      trend_filter: true
      ema_fast: 21
      ema_slow: 55
      first_entry_at_support: true
      atr_period: 14
      atr_multiplier: 1.2
      fib_lookback: 100
      leverage: 3           # 只影响占用保证金，不影响仓位大小
      td_mode: cross
      # 账户里有手动开的 ETH 多单，不交给策略管
      on_existing_position: ignore
